<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#100b09">

<title>Musu Countdown</title>


<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    background: #100b09;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =========================================================
   APP
   ========================================================= */

.app {

    position: relative;

    width: 100%;
    height: 100vh;
    height: 100dvh;

    max-width: 520px;

    margin: auto;

    overflow: hidden;

    isolation: isolate;
}


/* =========================================================
   BAR BACKGROUND
   ========================================================= */

.bar-background {

    position: absolute;

    inset: 0;

    z-index: 0;

    overflow: hidden;

    pointer-events: none;

    background:
        linear-gradient(
            180deg,
            #160d0d 0%,
            #241313 48%,
            #100b0a 100%
        );
}


/* =========================================================
   BAR WALL
   ========================================================= */

.bar-wall {

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            ellipse at 50% 20%,
            rgba(180,45,32,.24),
            transparent 40%
        ),

        linear-gradient(
            90deg,
            rgba(0,0,0,.50),
            transparent 35%,
            transparent 65%,
            rgba(0,0,0,.50)
        );
}


/* subtle wall lines */

.bar-wall::before {

    content: "";

    position: absolute;

    inset: 0;

    opacity: .08;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 23px,
            rgba(255,255,255,.12) 24px,
            transparent 25px
        );
}


/* =========================================================
   PATA ÄSSÄ SIGN
   ========================================================= */

.pata-logo {

    position: absolute;

    top: 12%;

    left: 50%;

    transform:
        translateX(-50%)
        rotate(-2deg);

    width: 205px;

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    background:
        linear-gradient(
            180deg,
            #eee5d4,
            #c7baa3
        );

    border: 4px solid #18100e;

    border-radius: 5px;

    box-shadow:
        0 4px 0 #5c241c,
        0 7px 18px rgba(0,0,0,.7);
}


.logo-pata,
.logo-assa {

    color: #9c241d;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 27px;

    font-weight: 900;

    letter-spacing: 1px;

    text-shadow:
        1px 1px 0 #5a1713;
}


.logo-spade {

    color: #9c241d;

    font-size: 30px;

    line-height: 1;
}


.screen-top {

    padding-top: 7px;

    text-align: center;

    font-size: 6px;

    color: #d3b35c;

    letter-spacing: 1px;

    font-weight: bold;
}


.screen-song {

    margin-top: 10px;

    text-align: center;

    color: #f0c85a;

    font-size: 19px;
}


.screen-song span {

    display: block;

    margin-top: 2px;

    color: #d8d8d8;

    font-size: 6px;

    letter-spacing: 1px;
}


.screen-lines {

    margin-top: 5px;

    text-align: center;

    color: #627979;

    font-size: 6px;
}


/* =========================================================
   KARAOKE BOOTH
   ========================================================= */

.karaoke-booth {

    position: absolute;

    top: 34%;

    right: -2%;

    width: 115px;

    height: 115px;

    background:
        linear-gradient(
            90deg,
            #291b19,
            #432422,
            #211515
        );

    border-radius:
        55px 55px 5px 5px;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.8);
}


.booth-back {

    position: absolute;

    left: 17px;

    right: 17px;

    bottom: 20px;

    height: 52px;

    background:
        linear-gradient(
            180deg,
            #6a2525,
            #3c1718
        );

    border-radius:
        45px 45px 8px 8px;
}


.booth-seat {

    position: absolute;

    left: 12px;

    right: 12px;

    bottom: 8px;

    height: 22px;

    background: #281516;

    border-radius: 10px;
}


.booth-light {

    position: absolute;

    top: 9px;

    left: 50%;

    transform: translateX(-50%);

    width: 42px;

    height: 4px;

    background: #d58c39;

    box-shadow:
        0 0 15px #d58c39;

    opacity: .7;
}


/* =========================================================
   REAR BAR
   ========================================================= */

.rear-bar {

    position: absolute;

    left: 5%;

    right: 5%;

    bottom: 29%;

    height: 90px;

    background: #120d0b;

    border: 3px solid #38241b;

    box-shadow:
        0 10px 25px rgba(0,0,0,.65);
}


.rear-shelf {

    position: absolute;

    left: 5%;

    right: 5%;

    height: 5px;

    background: #765032;

    box-shadow:
        0 3px 7px rgba(0,0,0,.7);
}


.shelf-a {
    top: 30px;
}

.shelf-b {
    top: 61px;
}


/* =========================================================
   BOTTLES
   ========================================================= */

.bar-bottle {

    position: absolute;

    bottom: 67px;

    width: 12px;

    height: 30px;

    background:
        linear-gradient(
            90deg,
            #1c281d,
            #53643b,
            #182018
        );

    border-radius:
        3px 3px 2px 2px;
}


.bar-bottle::before {

    content: "";

    position: absolute;

    left: 3px;

    top: -9px;

    width: 6px;

    height: 10px;

    background: #202a1c;
}


.bottle-a {
    left: 12%;
    height: 35px;
}

.bottle-b {
    left: 29%;
    height: 28px;
}

.bottle-c {
    left: 47%;
    height: 38px;
}

.bottle-d {
    left: 69%;
    height: 32px;
}

.bottle-e {
    left: 83%;
    height: 40px;
}


/* =========================================================
   PUB LIGHTS
   ========================================================= */

.pub-light {

    position: absolute;

    width: 95px;

    height: 95px;

    border-radius: 50%;

    background: #c76b2b;

    filter: blur(35px);

    opacity: .13;
}


.pub-light-1 {

    top: 15%;

    left: 2%;
}


.pub-light-2 {

    top: 20%;

    left: 50%;

    transform: translateX(-50%);

    width: 180px;

    height: 180px;

    opacity: .10;
}


.pub-light-3 {

    top: 15%;

    right: 2%;
}


/* =========================================================
   DISTANT TABLES
   ========================================================= */

.pub-table {

    position: absolute;

    bottom: 28%;

    width: 70px;

    height: 65px;

    opacity: .7;
}


.table-left {
    left: 3%;
}


.table-right {
    right: 3%;
}


.table-top {

    position: absolute;

    top: 0;

    left: 0;

    width: 70px;

    height: 16px;

    border-radius: 50%;

    background: #59331e;

    border: 2px solid #75462b;
}


.table-leg {

    position: absolute;

    top: 10px;

    left: 33px;

    width: 5px;

    height: 55px;

    background: #2b1a13;
}


/* =========================================================
   MAIN BAR COUNTER
   ========================================================= */

.main-bar {

    position: absolute;

    left: -5%;

    right: -5%;

    bottom: 0;

    height: 25%;

    background:

        linear-gradient(
            180deg,
            #704025 0%,
            #4a291b 12%,
            #29170f 45%,
            #110b08 100%
        );

    border-top: 7px solid #a36536;

    box-shadow:
        0 -15px 35px rgba(0,0,0,.75);
}


.bar-top {

    position: absolute;

    left: 0;

    right: 0;

    top: -7px;

    height: 7px;

    background:
        linear-gradient(
            90deg,
            #6d3e22,
            #bd7840,
            #7a4525,
            #bd7840,
            #62361e
        );

    box-shadow:
        0 2px 8px rgba(0,0,0,.8);
}


.bar-front {

    position: absolute;

    left: 5%;

    right: 5%;

    top: 30px;

    bottom: 10px;

    display: flex;

    justify-content: space-around;

    opacity: .35;
}


.bar-panel {

    width: 24%;

    border: 2px solid #754326;

    border-radius: 3px;

    background:
        linear-gradient(
            180deg,
            #321c12,
            #1b100b
        );
}


/* =========================================================
   TWO GUYS
   ========================================================= */

.people {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 4%;

    height: 42%;

    z-index: 4;

    pointer-events: none;

    opacity: .58;
}


.man {

    position: absolute;

    bottom: 0;

    width: 39%;

    max-width: 175px;

    height: auto;
}


.man-left {

    left: -8%;
}


.man-right {

    right: -8%;
}


/* =========================================================
   DARK OVERLAY
   ========================================================= */

.app::after {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.08) 65%,
            rgba(0,0,0,.40) 100%
        );
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    position: absolute;

    top: 3%;

    left: 0;

    right: 0;

    z-index: 20;

    text-align: center;

    padding: 0 15px;
}


.eyebrow {

    color: #e5a33e;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 4px;

    margin-bottom: 8px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}


.subtitle {

    margin-top: 4px;

    color: #d1c1b5;

    font-size: 14px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}


/* =========================================================
   COUNTDOWN
   ========================================================= */

.countdown {

    position: absolute;

    z-index: 20;

    top: 21%;

    left: 50%;

    transform: translateX(-50%);

    width: min(70vw, 310px);

    aspect-ratio: 1;
}


.countdown::before {

    content: "";

    position: absolute;

    inset: 12%;

    border-radius: 50%;

    background: #4cc9f0;

    opacity: .09;

    filter: blur(25px);
}


/* =========================================================
   SVG RING
   ========================================================= */

.ring {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    transform: rotate(-90deg);
}


.ring-background {

    fill: none;

    stroke:
        rgba(35,38,43,.95);

    stroke-width: 12;
}


.ring-progress {

    fill: none;

    stroke: #4cc9f0;

    stroke-width: 12;

    stroke-linecap: round;

    transition:
        stroke-dashoffset .5s linear;
}


/* =========================================================
   COUNTDOWN CENTER
   ========================================================= */

.center {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}


.center-title {

    color: #b0a49c;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-bottom: 12px;
}


.time {

    font-size:
        clamp(20px, 6.5vw, 34px);

    font-weight: 900;

    letter-spacing: 1px;

    white-space: nowrap;

    font-variant-numeric:
        tabular-nums;

    text-shadow:
        0 2px 10px rgba(0,0,0,.9);
}


.labels {

    margin-top: 9px;

    color: #77706c;

    font-size: 7px;

    letter-spacing: 1px;
}


/* =========================================================
   TARGET DATE
   ========================================================= */

.target {

    position: absolute;

    top: 72%;

    left: 0;

    right: 0;

    z-index: 20;

    text-align: center;
}


.target-label {

    color: #887b73;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2px;
}


.target-date {

    margin-top: 6px;

    color: #eee2d9;

    font-size: 14px;

    text-shadow:
        0 2px 7px rgba(0,0,0,.9);
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    position: absolute;

    bottom: 7px;

    left: 0;

    right: 0;

    z-index: 20;

    text-align: center;

    color: #776d67;

    font-size: 8px;
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-height: 700px) {

    .header {
        top: 2%;
    }

    .countdown {

        top: 20%;

        width: 270px;
    }

    .target {

        top: 71%;
    }

    .karaoke-screen {

        top: 32%;

        transform:
            perspective(300px)
            rotateX(2deg)
            scale(.90);
    }

    .karaoke-booth {

        top: 35%;

        transform: scale(.90);

        transform-origin: top right;
    }

    .pata-logo {

        top: 4%;

        transform:
            translateX(-50%)
            scale(.85)
            rotate(-2deg);
    }

}


/* =========================================================
   VERY SMALL SCREENS
   ========================================================= */

@media (max-height: 620px) {

    .header {

        top: 2%;
    }

    .eyebrow {

        font-size: 9px;

        margin-bottom: 5px;
    }

    .subtitle {

        font-size: 10px;
    }

    .countdown {

        top: 18%;

        width: 225px;
    }

    .target {

        top: 69%;
    }

    .pata-logo {

        top: 3%;

        width: 175px;

        height: 55px;

        transform:
            translateX(-50%)
            scale(.70)
            rotate(-2deg);
    }

    .karaoke-screen {

        top: 30%;

        transform:
            perspective(300px)
            rotateX(2deg)
            scale(.72);
    }

    .karaoke-booth {

        top: 33%;

        transform: scale(.72);

        transform-origin: top right;
    }

    .people {

        height: 38%;

        bottom: 3%;
    }

}


/* =========================================================
   NARROW PHONES
   ========================================================= */

@media (max-width: 360px) {

    .pata-logo {

        width: 170px;

        height: 55px;
    }

    .logo-pata,
    .logo-assa {

        font-size: 22px;
    }

    .logo-spade {

        font-size: 25px;
    }

    .people {

        opacity: .48;
    }

    .man {

        width: 38%;
    }

}


/* =========================================================
   EXTRA DARK EDGE
   ========================================================= */

.app::before {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 6;

    pointer-events: none;

    box-shadow:
        inset 0 0 90px rgba(0,0,0,.55);
}

</style>

</head>

     ===================================================== -->

<div class="countdown">

    <svg
        class="ring"
        viewBox="0 0 220 220"
    >

        <circle
            class="ring-background"
            cx="110"
            cy="110"
            r="96"
        />

        <circle
            id="progressRing"
            class="ring-progress"
            cx="110"
            cy="110"
            r="96"
        />

    </svg>


    <div class="center">

        <div class="center-title">
            TIME REMAINING
        </div>

        <div
            id="time"
            class="time"
        >
            Loading...
        </div>

        <div class="labels">
            DAYS &nbsp; HOURS &nbsp; MINUTES &nbsp; SECONDS
        </div>

    </div>

<!-- =====================================================
     TARGET DATE
     ===================================================== -->

<div class="target">

    <div class="target-label">
    </div>

    <div
        id="targetDate"
        class="target-date"
    >
        September 18
    </div>

</div>


<!-- FOOTER -->

<div class="footer">
</div>


</div>


<script>

/* =========================================================
   COUNTDOWN
   ========================================================= */

const time =
    document.getElementById("time");

const targetDate =
    document.getElementById("targetDate");

const ring =
    document.getElementById("progressRing");


/* =========================================================
   CIRCLE
   ========================================================= */

const radius = 96;

const circumference =
    2 * Math.PI * radius;

ring.style.strokeDasharray =
    circumference;

ring.style.strokeDashoffset =
    circumference;


/* =========================================================
   TARGET DATE
   ========================================================= */

function getTarget() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    let target =
        new Date(
            year,
            8,
            18,
            0,
            0,
            0,
            0
        );


    /*
       If September 18 has already passed,
       use next year's September 18.
    */

    if (
        now.getTime() >=
        target.getTime()
    ) {

        target =
            new Date(
                year + 1,
                8,
                18,
                0,
                0,
                0,
                0
            );
    }


    return target;
}


/* =========================================================
   UPDATE
   ========================================================= */

function update() {

    const now =
        new Date();

    const target =
        getTarget();


    const difference =
        target.getTime()
        -
        now.getTime();


    const totalSeconds =
        Math.max(
            0,
            Math.floor(
                difference / 1000
            )
        );


    /* DAYS */

    const days =
        Math.floor(
            totalSeconds / 86400
        );


    /* HOURS */

    const hours =
        Math.floor(
            (
                totalSeconds % 86400
            ) / 3600
        );


    /* MINUTES */

    const minutes =
        Math.floor(
            (
                totalSeconds % 3600
            ) / 60
        );


    /* SECONDS */

    const seconds =
        totalSeconds % 60;


    /* DISPLAY */

    time.textContent =

        String(days).padStart(2, "0")

        + " : "

        + String(hours).padStart(2, "0")

        + " : "

        + String(minutes).padStart(2, "0")

        + " : "

        + String(seconds).padStart(2, "0");


    /* TARGET DATE */

    targetDate.textContent =
        target.toLocaleDateString(
            undefined,
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );


    /* =====================================================
       YEAR PROGRESS
       ===================================================== */

    const yearStart =
        new Date(
            target.getFullYear(),
            0,
            1,
            0,
            0,
            0,
            0
        );


    const yearLength =
        target.getTime()
        -
        yearStart.getTime();


    const elapsed =
        now.getTime()
        -
        yearStart.getTime();


    let percentage =
        elapsed / yearLength;


    percentage =
        Math.max(
            0,
            Math.min(
                1,
                percentage
            )
        );


    const offset =
        circumference
        -
        (
            percentage *
            circumference
        );


    ring.style.strokeDashoffset =
        offset;
}


/* =========================================================
   START
   ========================================================= */

update();

setInterval(
    update,
    1000
);


/* =========================================================
   MOBILE / SAFARI
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (!document.hidden) {

            update();

        }

    }
);


window.addEventListener(
    "pageshow",
    function() {

        update();

    }
);

</script>
