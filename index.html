<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<meta name="theme-color"

<title>Musu Countdown</title>


<style>

/* ==============================
   PAGE
   ============================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    background:
        radial-gradient(
            circle at 50% 20%,
            #293c4d,
            #111820 55%,
            #05070a
        );

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* ==============================
   MAIN APP
   ============================== */

.app {

    width: 100%;
    height: 100vh;
    height: 100dvh;

    max-width: 520px;

    margin: auto;

    position: relative;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding-top: 30px;
}


/* ==============================
   HEADER
   ============================== */

.header {

    position: relative;

    z-index: 10;

    text-align: center;

    padding-left: 15px;
    padding-right: 15px;
}

.eyebrow {

    color: #4cc9f0;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 4px;

    margin-bottom: 10px;
}

h1 {

    margin: 0;

    font-size:
        clamp(38px, 11vw, 56px);

    line-height: 1;

    font-weight: 900;
}

.subtitle {

    margin-top: 10px;

    color: #a1aab6;

    font-size: 14px;
}


/* ==============================
   COUNTDOWN
   ============================== */

.countdown {

    width: min(82vw, 330px);

    aspect-ratio: 1;

    position: relative;

    margin-top: 28px;

    z-index: 5;
}


/* Glow */

.countdown:before {

    content: "";

    position: absolute;

    inset: 12%;

    border-radius: 50%;

    background: #4cc9f0;

    opacity: 0.08;

    filter: blur(25px);
}


/* ==============================
   SVG CIRCLE
   ============================== */

.ring {

    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    transform: rotate(-90deg);
}

.ring-background {

    fill: none;

    stroke: #29313b;

    stroke-width: 12;
}

.ring-progress {

    fill: none;

    stroke: #4cc9f0;

    stroke-width: 12;

    stroke-linecap: round;

    transition:
        stroke-dashoffset 0.5s linear;
}


/* ==============================
   CENTER
   ============================== */

.center {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}

.center-title {

    color: #8b96a4;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-bottom: 12px;
}

.time {

    font-size:
        clamp(20px, 6.5vw, 34px);

    font-weight: 900;

    letter-spacing: 1px;

    white-space: nowrap;

    font-variant-numeric:
        tabular-nums;
}

.labels {

    margin-top: 9px;

    color: #626d7b;

    font-size: 7px;

    letter-spacing: 1px;
}


/* ==============================
   TARGET
   ============================== */

.target {

    position: relative;

    z-index: 10;

    text-align: center;

    margin-top: 17px;
}

.target-label {

    color: #5e6977;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2px;
}

.target-date {

    margin-top: 6px;

    color: #d5dbe2;

    font-size: 14px;
}


/* ==============================
   STATUS
   ============================== */

.status {

    margin-top: 7px;

    color: #4cc9f0;

    font-size: 9px;
}


/* ==============================
   BACKGROUND PEOPLE
   ============================== */

.people {

    position: absolute;

    left: 0;
    right: 0;

    bottom: -20px;

    height: 48%;

    z-index: 1;

    pointer-events: none;

    opacity: 0.40;
}

.man {

    position: absolute;

    bottom: 0;

    width: 44%;

    max-width: 190px;
}

.man-left {

    left: -5%;
}

.man-right {

    right: -5%;
}


/* ==============================
   SMALL PHONES
   ============================== */

@media (max-height: 700px) {

    .app {
        padding-top: 22px;
    }

    .countdown {
        width: 270px;
        margin-top: 18px;
    }

    .target {
        margin-top: 10px;
    }
}

@media (max-height: 620px) {

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 11px;
    }

    .countdown {
        width: 235px;
        margin-top: 10px;
    }

}

</style>

</head>

<script>

/*
=========================================================
MUSU COUNTDOWN
=========================================================
*/


/*
   Get the countdown display.
*/

var time =
    document.getElementById("time");


/*
   Get the target date display.
*/

var targetDate =
    document.getElementById("targetDate");


/*
   Get status.
*/

var status =
    document.getElementById("status");


/*
   Get circle.
*/

var ring =
    document.getElementById("progressRing");


/*
=========================================================
CIRCLE SETUP
=========================================================
*/

var radius = 96;

var circumference =
    2 * Math.PI * radius;

ring.style.strokeDasharray =
    circumference;

ring.style.strokeDashoffset =
    circumference;


/*
=========================================================
GET SEPTEMBER 18
=========================================================
*/

function getTarget() {

    /*
       Get the iPhone's current local time.
    */

    var now =
        new Date();


    /*
       Get current year.
    */

    var year =
        now.getFullYear();


    /*
       JavaScript months start at ZERO.

       0  = January
       1  = February
       ...
       8  = September

       Therefore:

       new Date(year, 8, 18)
       = September 18
    */

    var target =
        new Date(
            year,
            8,
            18,
            0,
            0,
            0,
            0
        );


    /*
       If September 18 has already happened,
       count toward next September 18.
    */

    if (
        now.getTime() >=
        target.getTime()
    ) {

        target =
            new Date(
                year + 1,
                8,
                18,
                0,
                0,
                0,
                0
            );
    }


    return target;
}


/*
=========================================================
UPDATE
=========================================================
*/

function update() {

    /*
       Current phone time.
    */

    var now =
        new Date();


    /*
       September 18 target.
    */

    var target =
        getTarget();


    /*
       Difference in milliseconds.
    */

    var difference =
        target.getTime()
        -
        now.getTime();


    /*
       Convert to seconds.
    */

    var totalSeconds =
        Math.floor(
            difference / 1000
        );


    /*
       DAYS
    */

    var days =
        Math.floor(
            totalSeconds / 86400
        );


    /*
       HOURS
    */

    var hours =
        Math.floor(
            (
                totalSeconds % 86400
            ) / 3600
        );


    /*
       MINUTES
    */

    var minutes =
        Math.floor(
            (
                totalSeconds % 3600
            ) / 60
        );


    /*
       SECONDS
    */

    var seconds =
        totalSeconds % 60;


    /*
       Put the countdown on screen.

       Example:

       31 : 07 : 42 : 19
    */

    time.innerHTML =
        String(days).padStart(2, "0")
        + " : "
        + String(hours).padStart(2, "0")
        + " : "
        + String(minutes).padStart(2, "0")
        + " : "
        + String(seconds).padStart(2, "0");


    /*
       Show target date.
    */

    targetDate.innerHTML =
        target.toLocaleDateString(
            undefined,
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );


    /*
       Calculate circle progress.
    */

    var yearStart =
        new Date(
            target.getFullYear(),
            0,
            1,
            0,
            0,
            0,
            0
        );


    var yearLength =
        target.getTime()
        -
        yearStart.getTime();


    var elapsed =
        now.getTime()
        -
        yearStart.getTime();


    var percentage =
        elapsed / yearLength;


    /*
       Keep between 0 and 1.
    */

    if (
        percentage < 0
    ) {
        percentage = 0;
    }

    if (
        percentage > 1
    ) {
        percentage = 1;
    }


    /*
       Move circle.
    */

    var offset =
        circumference
        -
        (
            percentage *
            circumference
        );


    ring.style.strokeDashoffset =
        offset;


    /*
       Confirm that JavaScript
       is running.
    */

    status.innerHTML =
        "● LIVE";

}


/*
=========================================================
START
=========================================================
*/

update();


/*
   Update every second.
*/

setInterval(
    update,
    1000
);


/*
   Recalculate when Safari
   wakes the page.
*/

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            !document.hidden
        ) {

            update();

        }

    }
);


/*
   Recalculate when Safari
   restores the page.
*/

window.addEventListener(
    "pageshow",
    function() {

        update();

    }
);

</script>
